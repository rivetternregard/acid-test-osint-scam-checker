name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the pages
        run: |
          python3 - <<'PY'
          import pathlib, sys, re
          bad = []
          for p in pathlib.Path(".").rglob("*.html"):
              t = p.read_text(encoding="utf-8")
              if "</html>" not in t: bad.append(f"{p}: no closing tag")
              if 'charset' not in t: bad.append(f"{p}: no charset")
          for p in pathlib.Path(".").rglob("*.css"):
              t = p.read_text(encoding="utf-8")
              if t.count("{") != t.count("}"): bad.append(f"{p}: unbalanced braces")
          for p in pathlib.Path(".").rglob("*.js"):
              t = p.read_text(encoding="utf-8")
              if t.count("{") != t.count("}"): bad.append(f"{p}: unbalanced braces")
          if bad:
              print("\n".join(bad)); sys.exit(1)
          print("pages: OK")
          PY

      - name: Lint CSS
        run: npx --yes stylelint --config "{}" --fix false "**/*.css" || true

      - name: Report
        run: echo "CI passed for ${{ github.sha }}"
